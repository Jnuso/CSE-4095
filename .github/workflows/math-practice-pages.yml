name: Math Practice checks and Pages deployment

on:
  push:
    branches: [main]
    paths:
      - "Assignment 12/math-practice-app/**"
      - ".github/workflows/math-practice-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "Assignment 12/math-practice-app/**"
      - ".github/workflows/math-practice-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: math-practice-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Assignment 12/math-practice-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Assignment 12/math-practice-app/package-lock.json
      - run: npm ci
      - name: Install browser and Linux dependencies
        run: node scripts/browser-tests.mjs install --with-deps chromium --no-shell
      - name: Verify app and Pages build
        run: npm run check:all
      - name: Upload verified website only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: Assignment 12/math-practice-app/dist-pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy verified website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
