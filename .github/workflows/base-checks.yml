name: Base site checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Python test tools
        run: python -m pip install -r base/requirements-dev.txt
      - name: Lint Python tests
        run: python -m pylint --rcfile=base/.pylintrc base/tests
      - name: Test published site and demos
        env:
          SELENIUM_REQUIRED: '1'
        run: python -m pytest -q base
